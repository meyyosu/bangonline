<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nháp tab Đóng góp</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Be+Vietnam+Pro:wght@400;600;700;800&family=Roboto+Slab:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../public/style.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; color: #f4e4c1; background: radial-gradient(circle at 50% 40%, #3a2416, #120a05); }
  .screen { min-height: 100vh; box-sizing: border-box; max-width: 1240px; margin: 0 auto; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mini { margin: 0; font: 700 14px 'Roboto Slab', serif; color: #fde68a; }
  .result-steps { margin: 0; }
  .tools { display: flex; justify-content: center; gap: 8px; font-size: 12px; color: #e9d3a3; align-items: center; }
  .tools button { padding: 5px 11px; border-radius: 8px; border: 1px solid #d9a441; background: transparent; color: #f4e4c1; font: inherit; cursor: pointer; }
  .tools button.on { background: #d9a441; color: #2a1a0e; font-weight: 700; }
  .teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .pd { background: var(--paper); color: var(--ink); border: 2px solid #c9a46a; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); padding: 12px 16px; }
  .pd.law { border-top: 6px solid #2f5d8a; } .pd.out { border-top: 6px solid #8a2b1d; }
  .pd.win { box-shadow: 0 0 0 3px #d9a441, 0 6px 20px rgba(0,0,0,.35); }
  .pd h3 { margin: 0; font-family: 'Rye', serif; font-weight: normal; font-size: 18px; }
  .pd.law h3 { color: #2f5d8a; } .pd.out h3 { color: #8a2b1d; }
  .sub { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .wtag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: #d9a441; color: #2a1a0e; font: 800 10px 'Be Vietnam Pro', sans-serif; vertical-align: 3px; }
  .row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: center; }
  svg.pie { width: 210px; height: 210px; }
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 5px 8px; border-radius: 8px; background: #fffaf0; border: 1px solid #ecdcb8; }
  .li i { width: 14px; height: 14px; border-radius: 4px; }
  .li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .li .nm small { font-weight: 600; color: var(--muted); margin-left: 4px; }
  .li .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
  .li .v small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .li.neg { background: #f6eef6; border-color: #dccbe6; }
  .li.neg .v { color: #8a6aa8; }
  .li.me { outline: 2px solid #d9a441; }
  .li.ren { background: #f3edf8; border-color: #d8c8e8; border-style: dashed; }
  .extra { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .extra b { color: var(--ink); }
  .note { text-align: center; font-size: 12px; color: #e9d3a3; }
  .foot { display: flex; justify-content: space-between; margin-top: auto; }
  @media (max-width: 900px) { .teams { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; justify-items: center; } }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <p class="mini">Phe Sheriff &amp; Deputy chiến thắng · Bạn đã thắng</p>
    <nav class="result-steps"><button><span>1</span>Kết quả</button><button><span>2</span>Danh hiệu</button><button><span>3</span>Thống kê</button><button><span>4</span>Diễn biến</button><button class="on"><span>5</span>Đóng góp</button></nav>
  </div>

  <div class="teams">
    <section class="pd law" id="law"></section>
    <section class="pd out" id="out"></section>
  </div>
  <p class="note" id="note"></p>
  <div class="foot"><button class="btn ghost">← Diễn biến</button><button class="result-continue small">🔁 Về phòng chờ</button></div>
</div>
<script src="dong-gop.js"></script>
</body>
</html>
