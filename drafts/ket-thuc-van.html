<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nháp kết thúc ván</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alfa+Slab+One&family=Lora:ital,wght@0,500;0,700;1,500&family=Roboto+Slab:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --wood: #2b1a10; --wood2: #3d2616; --paper: #f4e4c1; --paper2: #e9d3a3; --ink: #2a1a0e; --muted: #7a5b3a; --red: #b5332a; --gold: #d9a441; --blue: #2f5d8a; --green: #3f7d3a; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: var(--ink);
  background: radial-gradient(ellipse at top, #5a3820 0%, var(--wood) 60%) fixed; min-height: 100vh; }
button { font: inherit; }
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: rgba(0,0,0,.7); border-bottom: 2px solid var(--gold); color: var(--paper); }
.picker .brand { font-family: 'Rye', serif; color: var(--gold); font-size: 22px; margin-right: 10px; }
.picker button { background: transparent; color: var(--paper); border: 1px solid rgba(244,228,193,.5); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.picker button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }
.picker .sep { width: 1px; height: 24px; background: rgba(244,228,193,.3); margin: 0 6px; }
.picker .lbl { font-size: 13px; color: var(--paper2); }
.note { max-width: 1100px; margin: 12px auto 0; padding: 0 16px; color: var(--paper2); font-size: 14px; }
.note b { color: var(--gold); }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
.panel { background: var(--paper); border-radius: 10px; padding: 16px 18px; border: 2px solid #c9a46a; box-shadow: 0 6px 20px rgba(0,0,0,.4), inset 0 0 40px rgba(122,91,58,.25); }
.panel h2, .panel h3 { font-family: 'Rye', serif; font-weight: normal; color: var(--red); margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 13px; }
.btn { background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; box-shadow: 0 3px 0 #6e1d17; }
.btn.green { background: var(--green); box-shadow: 0 3px 0 #23481f; }
.btn.secondary { background: var(--muted); box-shadow: 0 3px 0 #4a3520; }
.btn.ghost { background: transparent; color: var(--paper); box-shadow: none; border: 1px solid var(--paper); }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.role { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; white-space: nowrap; }
.role.Sheriff { background: #c48a12; } .role.Deputy { background: var(--blue); } .role.Outlaw { background: #6b2b1d; } .role.Renegade { background: #5a4a7a; }
.me-tag { font-size: 11px; color: var(--muted); font-weight: 400; }
.dead { opacity: .55; }
.best { background: rgba(217,164,65,.35); font-weight: 700; border-radius: 4px; }

/* bảng thống kê dùng chung */
.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats th, .stats td { padding: 7px 8px; text-align: center; border-bottom: 1px solid #d8bd8a; }
.stats th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 2px solid #c9a46a; }
.stats td:first-child, .stats th:first-child { text-align: left; }
.stats tr.win td:first-child { border-left: 4px solid var(--green); }
.stats tr.lose td:first-child { border-left: 4px solid #a99; }
.tbl-wrap { overflow-x: auto; }
.ph { display: inline-block; font-size: 11px; background: #fffaf0; border: 1px dashed var(--muted); color: var(--muted); padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

/* ====== A: hai cột theo phác thảo ====== */
.a-head { text-align: center; color: var(--paper); margin: 6px 0 14px; }
.a-head .big { font-size: 46px; }
.a-head h1 { font-family: 'Rye', serif; font-weight: normal; color: var(--gold); margin: 0; font-size: 34px; text-shadow: 2px 2px 0 #000; }
.a-head p { margin: 4px 0 0; color: var(--paper2); }
.a-res { display: grid; grid-template-columns: 1fr 2px 1fr; gap: 18px; border-radius: 40px; padding: 20px 30px; }
.a-res .divider { background: #c9a46a; }
.a-res h3 { text-align: center; font-size: 22px; }
.a-res .col.win h3 { color: var(--green); } .a-res .col.lose h3 { color: #6b5a4a; }
.a-res ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.a-res li { display: flex; align-items: center; gap: 8px; background: #fffaf0; border: 1px solid #d8bd8a; border-radius: 8px; padding: 8px 10px; }
.a-res li .nm { font-weight: 700; }
.a-res li .ch { font-size: 12px; color: var(--muted); }
.a-res li .st { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
.a-stats { margin-top: 18px; border-radius: 40px; padding: 20px 30px; }

/* ====== B: poster truy nã ====== */
.b-title { text-align: center; color: var(--paper); margin-bottom: 18px; }
.b-title h1 { font-family: 'Rye', serif; font-weight: normal; font-size: 40px; color: var(--gold); margin: 0; text-shadow: 3px 3px 0 #000; letter-spacing: 1px; }
.b-title .ribbon { display: inline-block; margin-top: 8px; background: var(--red); color: #fff; padding: 4px 18px; font-weight: 700; letter-spacing: 1px; clip-path: polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%); }
.posters { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
.poster { width: 180px; background: linear-gradient(#f7e9c8, #e6cf9c); border: 2px solid #8a6a3a; padding: 12px 10px 14px; text-align: center; box-shadow: 0 8px 18px rgba(0,0,0,.5); position: relative; transform: rotate(var(--rot, 0deg)); }
.poster::before { content: ''; position: absolute; top: 6px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #555; box-shadow: inset -2px -2px 0 #222; }
.poster .w { font-family: 'Rye', serif; font-size: 22px; color: var(--ink); margin-top: 8px; letter-spacing: 2px; }
.poster .face { width: 90px; height: 90px; margin: 8px auto; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: radial-gradient(circle at 35% 30%, #fff3d6, #c9a46a); border: 3px solid #8a6a3a; }
.poster .nm { font-family: 'Rye', serif; font-size: 20px; color: var(--red); }
.poster .ch { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.poster .stamp { position: absolute; right: -10px; top: 92px; transform: rotate(-14deg); border: 3px solid var(--green); color: var(--green); font-weight: 800; padding: 2px 8px; font-size: 14px; background: rgba(255,250,240,.7); }
.losers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
.tomb { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.35); color: var(--paper2); border: 1px solid rgba(244,228,193,.25); border-radius: 30px 30px 8px 8px; padding: 8px 14px; min-width: 200px; }
.tomb .ic { font-size: 26px; filter: grayscale(1); }
.tomb b { color: var(--paper); }
.tomb small { display: block; font-size: 12px; opacity: .8; }
.b-tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid #c9a46a; }
.b-tabs button { background: none; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
.b-tabs button.on { color: var(--red); border-bottom: 3px solid var(--red); margin-bottom: -2px; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.award { background: #fffaf0; border: 1px solid #d8bd8a; border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
.award .ic { font-size: 30px; }
.award .t { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.award .n { font-weight: 700; }
.award .v { font-size: 12px; color: var(--red); font-weight: 600; }

.btn.small { padding: 5px 10px; font-size: 13px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }

/* --- B: thanh chuyển 3 màn --- */
.b-mini { text-align: center; color: var(--paper2); margin-bottom: 10px; font-size: 15px; }
.b-mini b { font-family: 'Rye', serif; font-weight: normal; color: var(--gold); font-size: 22px; text-shadow: 2px 2px 0 #000; }
.b-nav { display: flex; justify-content: center; gap: 0; margin: 0 auto 22px; width: fit-content; max-width: 100%; border: 2px solid var(--gold); border-radius: 12px; overflow: hidden; background: rgba(0,0,0,.35); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.b-nav button { border: 0; background: transparent; color: var(--paper); padding: 11px 22px; cursor: pointer; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.b-nav button + button { border-left: 1px solid rgba(217,164,65,.5); }
.b-nav button .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 12px; }
.b-nav button.on { background: var(--gold); color: var(--ink); }
.b-nav button:not(.on):hover { background: rgba(217,164,65,.15); }
.b-step { display: flex; justify-content: space-between; margin-top: 18px; }
.b-step .sp { flex: 1; }

/* --- B: màn Danh hiệu — lưới 4×3, mỗi ô 2 dòng top 1 / top 2, vừa 1 màn hình desktop --- */
main.wide { max-width: 1320px; }
.aw-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--paper2); font-size: 14px; margin-bottom: 10px; }
.aw-bar b { color: var(--gold); font-size: 18px; }
.aw-legend { display: inline-flex; gap: 14px; font-size: 12px; }
.aw-legend .sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.sw.glory { background: var(--gold); } .sw.tease { background: #b89ad0; }
.aw-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.aw { position: relative; background: var(--paper); border: 2px solid #c9a46a; border-top: 5px solid var(--gold); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.aw.tease { border-top-color: #8a6aa8; background: #f6eef6; }
.aw.mine { box-shadow: 0 0 0 3px var(--gold), 0 6px 16px rgba(0,0,0,.35); }
.aw-you { position: absolute; top: -11px; right: 10px; background: var(--gold); color: var(--ink); font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 99px; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.aw-h { display: flex; gap: 9px; align-items: center; min-height: 44px; }
.aw-ic { font-size: 22px; width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3d6, #e2c286); border: 2px solid #c9a46a; }
.aw.tease .aw-ic { background: radial-gradient(circle at 35% 30%, #f3e8fb, #c7afd9); border-color: #a58cbf; }
.aw-t { font-family: 'Rye', serif; font-size: 16px; color: var(--red); line-height: 1.15; }
.aw.tease .aw-t { color: #5a4a7a; }
.aw-d { font-size: 11.5px; color: var(--muted); line-height: 1.25; margin-top: 2px; }
.pod { display: flex; align-items: center; gap: 7px; border-radius: 7px; padding: 5px 8px; min-height: 38px; }
.pod.p1 { background: linear-gradient(90deg, rgba(217,164,65,.38), rgba(217,164,65,.12)); }
.pod.p2 { background: rgba(160,166,174,.16); font-size: 13px; }
.pod .medal { font-size: 20px; line-height: 1; }
.pod.p2 .medal { font-size: 16px; }
.pod .who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pod.p1 .who b { font-size: 15px; }
.pod .who .role { font-size: 9px; padding: 1px 6px; }
.pod.me .who b { color: var(--blue); text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
.pod .val { font-weight: 800; text-align: right; white-space: nowrap; }
.pod.p1 .val { font-size: 17px; }
.pod .val small { display: block; font-weight: 400; font-size: 10px; color: var(--muted); }
.pod.none { opacity: .5; } .pod.none .who { font-size: 12px; }
.b-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.b-foot .actions { margin: 0; flex: 1; }
@media (max-width: 1100px) { .aw-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 800px) { .aw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .aw-grid { grid-template-columns: 1fr; } .b-nav button { padding: 9px 12px; font-size: 13px; } .b-nav button .lb { display: none; } }

/* --- B: màn Kết quả — chuyển từ file mẫu (Tailwind) sang CSS thuần --- */
.r-stage { position: relative; border-radius: 16px; overflow: hidden; min-height: min(820px, calc(100vh - 120px)); display: flex; }
.r-board { position: absolute; inset: -20px; filter: blur(5px) brightness(.85);
  background: radial-gradient(ellipse 40% 34% at 40% 58%, #6b3e1e 0 60%, transparent 61%),
    linear-gradient(90deg, transparent 68%, #e9d3a3 68% 98%, transparent 98%),
    repeating-linear-gradient(45deg, #4a2e1a 0 22px, #45291a 22px 44px); }
.r-overlay { position: relative; flex: 1; display: flex; padding: 32px; color: #fff;
  background: radial-gradient(circle at 50% 42%, rgba(18,11,7,.52) 0%, rgba(7,4,2,.82) 100%);
  box-shadow: inset 0 0 110px rgba(0,0,0,.85); }
.r-frame { flex: 1; border-radius: 16px; border: 1px solid rgba(251,191,36,.16); box-shadow: inset 0 0 45px rgba(217,119,6,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 40px; }
.r-dust { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(252,211,77,.3); pointer-events: none; animation: r-dust 5.5s ease-in-out infinite; }
.r-dust.b { width: 8px; height: 8px; background: rgba(253,230,138,.2); }
@keyframes r-dust { 0%, 100% { transform: translateY(0); opacity: .3; } 50% { transform: translateY(-16px); opacity: .7; } }

.r-title { margin: 0 0 12px; font-family: 'Alfa Slab One', 'Roboto Slab', Cambria, serif; font-weight: normal; font-size: clamp(48px, 8vw, 96px); line-height: 1.1;
  letter-spacing: .05em; text-transform: uppercase; display: inline-block; transform: rotate(-1deg); user-select: none;
  -webkit-text-stroke: 1.5px; animation: r-slam .45s cubic-bezier(.22,1,.36,1) both; }
.win .r-title { color: #4ade80; -webkit-text-stroke-color: #052e16;
  text-shadow: 0 4px 0 #052e16, 0 0 20px rgba(74,222,128,.95), 0 0 44px rgba(34,197,94,.8), 0 0 80px rgba(22,163,74,.6); filter: drop-shadow(0 0 22px rgba(34,197,94,.7)); }
.lose .r-title { color: #f87171; -webkit-text-stroke-color: #450a0a;
  text-shadow: 0 4px 0 #450a0a, 0 0 20px rgba(248,113,113,.95), 0 0 44px rgba(239,68,68,.8), 0 0 80px rgba(220,38,38,.6); filter: drop-shadow(0 0 22px rgba(239,68,68,.7)); }
@keyframes r-slam { 0% { opacity: 0; transform: scale(1.35) rotate(-3deg); } 70% { opacity: 1; transform: scale(.97) rotate(-.7deg); } 100% { opacity: 1; transform: scale(1) rotate(-1deg); } }

.r-emblem { width: 100%; max-width: 512px; display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 48px;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(251,191,36,.35)); }
.r-emblem .ln { flex: 1; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(251,191,36,.6), #fcd34d); }
.r-emblem .ln.r { background: linear-gradient(270deg, transparent, rgba(251,191,36,.6), #fcd34d); }
.r-guns { width: 144px; height: 80px; flex-shrink: 0; }

.r-team { width: 100%; max-width: 1024px; display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 32px 56px; margin-bottom: 56px; }
.r-card { width: 192px; display: flex; flex-direction: column; align-items: center; }
.r-medal-wrap { position: relative; margin-bottom: 14px; }
.r-me-glow { position: absolute; inset: -10px; border-radius: 50%; filter: blur(12px); animation: r-pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
.win .r-me-glow { background: rgba(16,185,129,.35); } .lose .r-me-glow { background: rgba(239,68,68,.3); }
@keyframes r-pulse { 50% { opacity: .5; } }
.r-medal { position: relative; width: 128px; height: 128px; border-radius: 50%; padding: 6px; transition: transform .3s;
  background: conic-gradient(from 45deg, #78350f, #d97706, #fef08a, #b45309, #78350f, #f59e0b, #78350f);
  box-shadow: 0 14px 30px rgba(0,0,0,.85), inset 0 2px 4px rgba(255,255,255,.65), inset 0 -3px 6px rgba(69,26,3,.85); }
.r-card:hover .r-medal { transform: scale(1.05); }
.r-portrait { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 2px solid #0c0a09; display: flex; align-items: center; justify-content: center; }
.r-portrait.Sheriff { background: linear-gradient(#b45309, #1c1917); }
.r-portrait.Deputy { background: linear-gradient(#075985, #1c1917); }
.r-portrait.Outlaw { background: linear-gradient(#7f1d1d, #0c0a09); }
.r-portrait.Renegade { background: linear-gradient(#3b0764, #0c0a09); }
.r-face { width: 100%; height: 100%; }
.r-down { position: absolute; inset: 0; background: rgba(12,10,9,.65); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(1px); }
.r-down span { color: #f87171; font-family: 'Alfa Slab One', 'Roboto Slab', Cambria, serif; font-size: 14px; letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid rgba(248,113,113,.8); background: rgba(12,10,9,.9); padding: 2px 10px; border-radius: 4px; transform: rotate(-12deg); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.r-role { position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 2px 12px; border-radius: 99px;
  font: 700 12px 'Roboto Slab', Cambria, serif; border: 1px solid; box-shadow: 0 4px 8px rgba(0,0,0,.4); }
.r-role.Sheriff { background: #f59e0b; color: #0c0a09; border-color: #fde68a; }
.r-role.Deputy { background: #075985; color: #e0f2fe; border-color: #38bdf8; }
.r-role.Outlaw { background: #991b1b; color: #fee2e2; border-color: #f87171; }
.r-role.Renegade { background: #581c87; color: #f3e8ff; border-color: #c084fc; }
.r-name { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 700 18px 'Roboto Slab', Cambria, serif; color: #fff; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.r-name .nm { max-width: 155px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-you { font-size: 10px; text-transform: uppercase; background: #f59e0b; color: #0c0a09; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
.r-char { margin-top: 2px; font: italic 500 14px 'Lora', Cambria, serif; color: rgba(254,243,199,.9); }

.r-next { min-width: 240px; padding: 16px 40px; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  font: 700 20px 'Roboto Slab', Cambria, serif; letter-spacing: .05em; text-transform: uppercase; color: #fff;
  background: linear-gradient(180deg, #9a5b13 0%, #6b3b09 50%, #452205 100%); border: 2px solid #facc15;
  box-shadow: 0 6px 0 #1f0f02, 0 14px 28px rgba(0,0,0,.8), 0 0 24px rgba(250,204,21,.28), inset 0 1px 1px rgba(254,240,138,.55);
  transition: transform .12s ease, box-shadow .12s ease, filter .15s ease; }
.r-next:hover { filter: brightness(1.14); transform: translateY(-1px); }
.r-next:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f0f02, 0 4px 10px rgba(0,0,0,.75); }
.r-cyl { width: 20px; height: 20px; color: #fcd34d; }
.r-next.small-next { min-width: 0; padding: 10px 24px; font-size: 16px; box-shadow: 0 4px 0 #1f0f02, 0 8px 16px rgba(0,0,0,.6), inset 0 1px 1px rgba(254,240,138,.55); }
.b-foot .sp { flex: 1; }
@media (prefers-reduced-motion: reduce) { .r-title, .r-me-glow, .r-dust { animation: none !important; } }
@media (max-width: 640px) {
  .r-overlay { padding: 16px; } .r-frame { padding: 32px 16px; }
  .r-guns { width: 112px; height: 64px; } .r-emblem { margin-bottom: 32px; }
  .r-card { width: 160px; } .r-medal { width: 112px; height: 112px; } .r-name { font-size: 16px; } .r-char { font-size: 12px; }
  .r-team { gap: 32px; margin-bottom: 40px; } .r-next:not(.small-next) { width: 100%; font-size: 18px; }
}

/* --- B: màn Thống kê --- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: rgba(0,0,0,.35); border: 1px solid rgba(217,164,65,.5); border-radius: 10px; padding: 10px 14px; color: var(--paper2); font-size: 12px; }
.kpi b { display: block; font-size: 26px; color: var(--gold); font-family: 'Rye', serif; font-weight: normal; }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* ====== C: bảng tổng sắp ====== */
.c-banner { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 12px; color: var(--paper); border: 2px solid var(--gold); background: linear-gradient(90deg, #3d2616, #2a160a); margin-bottom: 14px; }
.c-banner .ic { font-size: 50px; }
.c-banner h1 { margin: 0; font-family: 'Rye', serif; font-weight: normal; color: var(--gold); font-size: 30px; }
.c-banner p { margin: 2px 0 0; color: var(--paper2); }
.c-banner .meta { margin-left: auto; text-align: right; font-size: 13px; color: var(--paper2); }
.c-banner .meta b { color: var(--paper); font-size: 18px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { background: #fffaf0; border: 1px solid #d8bd8a; border-radius: 99px; padding: 4px 12px 4px 6px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip span:first-child { font-size: 18px; }
.res { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
.res.w { background: var(--green); color: #fff; } .res.l { background: #cdbfa8; color: #5a4a3a; }
.stats tr.sep td { padding: 0; border-bottom: 2px dashed #c9a46a; }
.c-player { display: flex; align-items: center; gap: 8px; }
.c-player .ch { font-size: 12px; color: var(--muted); }

/* ====== D: overlay + diễn biến ====== */
.d-stage { position: relative; min-height: 640px; border-radius: 12px; overflow: hidden; border: 2px solid #5a3820; }
.d-fakeboard { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #4a2e1a 0 20px, #45291a 20px 40px); filter: blur(2px); }
.d-fakeboard::after { content: 'bàn chơi phía sau (làm mờ)'; position: absolute; left: 20px; top: 14px; color: rgba(244,228,193,.3); font-size: 13px; }
.d-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 20px; }
.d-modal { width: min(920px, 100%); max-height: 100%; overflow: auto; }
.d-top { text-align: center; margin-bottom: 12px; }
.d-top .ic { font-size: 42px; }
.d-top h2 { font-size: 30px; margin: 0; }
.d-top h2.win { color: var(--green); }
.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.d-box { background: #fffaf0; border: 1px solid #d8bd8a; border-radius: 10px; padding: 12px; }
.d-box h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.d-team { display: flex; flex-direction: column; gap: 6px; }
.d-team .r { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.d-team .r .grow { flex: 1; }
.d-team .hd { font-weight: 700; font-size: 13px; margin: 6px 0 2px; }
.d-team .hd.w { color: var(--green); } .d-team .hd.l { color: #6b5a4a; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid #c9a46a; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.timeline li { position: relative; }
.timeline li::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid #fffaf0; }
.timeline li.end::before { background: var(--gold); }
.timeline .tn { color: var(--muted); font-size: 11px; display: block; }
.d-bars { margin-top: 16px; }
.d-bars .sel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.d-bars .sel button { border: 1px solid #c9a46a; background: #fffaf0; border-radius: 99px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.d-bars .sel button.on { background: var(--red); color: #fff; border-color: var(--red); }
.bar { display: grid; grid-template-columns: 110px 1fr 36px; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
.bar .track { height: 16px; background: #eadbb9; border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; transition: width .4s; }
.bar .num { font-weight: 700; text-align: right; }

@media (max-width: 720px) {
  .a-res { grid-template-columns: 1fr; border-radius: 20px; padding: 16px; } .a-res .divider { height: 2px; }
  .a-stats { border-radius: 20px; padding: 16px; }
  .d-grid { grid-template-columns: 1fr; }
  .c-banner { flex-wrap: wrap; } .c-banner .meta { margin-left: 0; text-align: left; }
  .b-title h1 { font-size: 30px; }
}
</style>
</head>
<body>
<div class="picker" id="picker"></div>
<div class="note" id="note"></div>
<main id="main"></main>

<script>
const ROLE_ICON = { Sheriff: '⭐', Deputy: '🛡️', Outlaw: '💀', Renegade: '🎭' };
const FACTION = { Sheriff: 'Phe Sheriff', Outlaw: 'Phe Outlaw', Renegade: 'Renegade' };
const FACTION_ICON = { Sheriff: '⭐', Outlaw: '💀', Renegade: '🎭' };

// Dữ liệu mẫu — thống kê chỉ là ví dụ, chưa chốt
const BASE = [
  { name: 'Toàn', role: 'Sheriff',  char: 'Willy the Kid',   bang: 14, dmg: 7, taken: 3, kills: 3, missed: 4, beer: 2, cards: 31 },
  { name: 'Minh', role: 'Deputy',   char: 'Slab the Killer', bang: 9,  dmg: 5, taken: 4, kills: 1, missed: 2, beer: 1, cards: 22 },
  { name: 'Hùng', role: 'Outlaw',   char: 'Bart Cassidy',    bang: 8,  dmg: 4, taken: 6, kills: 1, missed: 1, beer: 0, cards: 24 },
  { name: 'Lan',  role: 'Outlaw',   char: 'Jourdonnais',     bang: 5,  dmg: 3, taken: 5, kills: 0, missed: 5, beer: 1, cards: 17 },
  { name: 'Tuấn', role: 'Outlaw',   char: 'Calamity Janet',  bang: 11, dmg: 4, taken: 4, kills: 0, missed: 3, beer: 0, cards: 20 },
  { name: 'Vy',   role: 'Renegade', char: 'Kit Carlson',     bang: 6,  dmg: 3, taken: 4, kills: 1, missed: 2, beer: 2, cards: 26 },
];
// Diễn biến tử vong theo từng kịch bản thắng: [nạn nhân, kẻ hạ, lượt]
const SCEN = {
  Sheriff:  { deaths: [['Lan','Toàn',9], ['Vy','Minh',15], ['Tuấn','Toàn',19], ['Minh','Hùng',22], ['Hùng','Toàn',24]], turns: 24, mins: 37 },
  Outlaw:   { deaths: [['Vy','Toàn',8], ['Lan','Toàn',12], ['Minh','Hùng',16], ['Toàn','Tuấn',21]], turns: 21, mins: 31 },
  Renegade: { deaths: [['Lan','Toàn',7], ['Minh','Hùng',11], ['Tuấn','Vy',16], ['Hùng','Toàn',20], ['Toàn','Vy',27]], turns: 27, mins: 44 },
};
const STAT_COLS = [
  ['bang', 'Bang! bắn'], ['dmg', 'Sát thương gây'], ['taken', 'Máu mất'], ['kills', 'Hạ gục'],
  ['missed', 'Né được'], ['beer', 'Beer'], ['cards', 'Bài đã đánh'],
];

const S = { design: 'B', winner: 'Sheriff', viewer: 'Toàn', bTab: 'result', dStat: 'dmg' };

function players() {
  const sc = SCEN[S.winner];
  return BASE.map((p) => {
    const d = sc.deaths.find((x) => x[0] === p.name);
    const win = S.winner === 'Sheriff' ? (p.role === 'Sheriff' || p.role === 'Deputy')
      : S.winner === 'Outlaw' ? p.role === 'Outlaw' : p.role === 'Renegade';
    return { ...p, alive: !d, killer: d?.[1], diedTurn: d?.[2], win };
  });
}
const best = (ps, k) => Math.max(...ps.map((p) => p[k]));
const roleTag = (p) => `<span class="role ${p.role}">${ROLE_ICON[p.role]} ${p.role}</span>`;
const meTag = (p) => p.name === S.viewer ? ' <span class="me-tag">(bạn)</span>' : '';
const fate = (p) => p.alive ? '❤️ Còn sống' : `☠️ Bị ${p.killer} hạ · lượt ${p.diedTurn}`;
const iWon = () => players().find((p) => p.name === S.viewer).win;
function headline() {
  return iWon() ? { ic: '🏆', t: 'Bạn đã thắng!', s: 'Chúc mừng, cao bồi!' } : { ic: '💀', t: 'Bạn đã thua', s: 'Lần sau may mắn hơn nhé.' };
}
function actions(dark) {
  const host = S.viewer === 'Toàn';
  return `<div class="actions">
    ${host ? '<button class="btn green">🔁 Về phòng chờ</button>' : `<span class="${dark ? '' : 'muted'}" style="${dark ? 'color:var(--paper2);font-size:13px' : ''};align-self:center">Chờ chủ phòng mở ván mới…</span>`}
    <button class="btn ${dark ? 'ghost' : 'secondary'}">👁 Xem lại bàn chơi</button>
    <button class="btn ${dark ? 'ghost' : 'secondary'}">Rời phòng</button></div>`;
}
function statsTable(ps, { sep } = {}) {
  const rows = ps.map((p) => `<tr class="${p.win ? 'win' : 'lose'} ${p.alive ? '' : ''}">
      <td><b>${p.name}</b>${meTag(p)} ${roleTag(p)}</td>
      ${STAT_COLS.map(([k]) => `<td><span class="${p[k] === best(ps, k) && p[k] > 0 ? 'best' : ''}" style="padding:1px 6px">${p[k]}</span></td>`).join('')}
    </tr>`).join('');
  return `<div class="tbl-wrap"><table class="stats"><thead><tr><th>Người chơi</th>${STAT_COLS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function awardsList(ps) {
  const top = (k) => ps.reduce((a, b) => (b[k] > a[k] ? b : a));
  const low = (k) => ps.reduce((a, b) => (b[k] < a[k] ? b : a));
  return [
    ['🔫', 'Tay súng nóng nhất', top('bang'), (p) => `${p.bang} phát Bang!`],
    ['🎯', 'Sát thủ', top('kills'), (p) => `${p.kills} mạng`],
    ['💥', 'Gây sát thương nhất', top('dmg'), (p) => `${p.dmg} máu`],
    ['🛡️', 'Né giỏi nhất', top('missed'), (p) => `${p.missed} lần né`],
    ['🩸', 'Bao cát', top('taken'), (p) => `mất ${p.taken} máu`],
    ['🍺', 'Bợm nhậu', top('beer'), (p) => `${p.beer} lon Beer`],
  ];
}

// ---------- 12 danh hiệu đã chốt (phương án B) ----------
// kind: 'glory' = vinh danh, 'tease' = chọc ghẹo.  top: [[tên, giá trị, phụ chú?], ...] (tối đa 3) — dữ liệu mẫu
const AWARDS = [
  { ic: '🔫', t: 'Tay súng nóng nhất', d: 'Bắn nhiều Bang! nhất', kind: 'glory',
    top: [['Toàn', '14 phát'], ['Tuấn', '11 phát'], ['Minh', '9 phát']] },
  { ic: '💥', t: 'Kẻ gây tổn thương', d: 'Gây nhiều sát thương nhất', kind: 'glory',
    top: [['Toàn', '7 máu'], ['Minh', '5 máu'], ['Hùng', '4 máu']] },
  { ic: '🏹', t: 'Đại đại đi', d: 'Đánh nhiều Gatling + Indians! nhất', kind: 'glory',
    top: [['Tuấn', '3 lá'], ['Vy', '2 lá'], ['Toàn', '1 lá']] },
  { ic: '🧠', t: 'Kẻ ủ mưu', d: 'Sát thương nhiều nhất trong 1 lượt', kind: 'glory',
    top: [['Minh', '4 máu', 'lượt 15'], ['Toàn', '3 máu', 'lượt 9'], ['Tuấn', '2 máu', 'lượt 12']] },
  { ic: '🍺', t: 'Khách quen Saloon', d: 'Hồi nhiều máu nhất bằng Beer/Saloon', kind: 'glory',
    top: [['Vy', '4 máu'], ['Toàn', '3 máu'], ['Lan', '1 máu']] },
  { ic: '🫗', t: 'Trắng tay', d: 'Nhiều lượt không còn lá bài nào', kind: 'tease',
    top: [['Lan', '6 lượt'], ['Hùng', '4 lượt'], ['Tuấn', '2 lượt']] },
  { ic: '💰', t: 'Nhà giàu', d: 'Đặt nhiều lá trang bị nhất', kind: 'glory',
    top: [['Vy', '6 lá'], ['Toàn', '5 lá'], ['Minh', '3 lá']] },
  { ic: '💘', t: 'Ai cũng quý bạn', d: 'Bị nhắm nhiều nhất (Bang!, Panic!, Cat Balou, Duel…)', kind: 'tease',
    top: [['Toàn', '15 lần'], ['Hùng', '9 lần'], ['Vy', '6 lần']] },
  { ic: '🍀', t: 'Nhân phẩm tốt', d: 'Rút kiểm tra may hơn kỳ vọng nhiều nhất', kind: 'glory',
    top: [['Lan', '+25%', '2/4 lần'], ['Vy', '+15%', '2/5 lần'], ['Minh', '+8%', '1/3 lần']] },
  { ic: '🔥', t: 'Kiếp trước đốt chùa', d: 'Rút kiểm tra xui hơn kỳ vọng nhiều nhất', kind: 'tease',
    top: [['Tuấn', '−25%', '0/6 lần'], ['Toàn', '−5%', '3/15 lần'], ['Hùng', '−2%', '1/4 lần']] },
  { ic: '🤦', t: 'Bắn nhầm đồng đội', d: 'Gây nhiều sát thương nhất cho người cùng phe', kind: 'tease',
    top: [['Tuấn', '2 máu', 'vào Lan'], ['Toàn', '1 máu', 'vào Minh']] },
  { ic: '🪑', t: 'Có tham dự', d: 'Người phe thắng gây ít sát thương nhất', kind: 'tease',
    top: [['Minh', '5 máu'], ['Toàn', '7 máu']] },
];
const MEDAL = ['🥇', '🥈', '🥉'];

// Mỗi ô: tiêu đề + 2 dòng 🥇 top 1 / 🥈 top 2
function awardCard(a) {
  const mine = a.top[0]?.[0] === S.viewer;
  const line = (i) => {
    const e = a.top[i];
    if (!e) return `<div class="pod p${i + 1} none"><span class="medal">${MEDAL[i]}</span><span class="who">— không có ai —</span></div>`;
    const [n, v, sub] = e, p = BASE.find((x) => x.name === n);
    return `<div class="pod p${i + 1} ${n === S.viewer ? 'me' : ''}"><span class="medal">${MEDAL[i]}</span>
      <span class="who"><b>${n}</b>${n === S.viewer ? ' <span class="me-tag">(bạn)</span>' : ''} <span class="role ${p.role}">${p.role}</span></span>
      <span class="val">${v}${sub ? `<small>${sub}</small>` : ''}</span></div>`;
  };
  return `<div class="aw ${a.kind} ${mine ? 'mine' : ''}">${mine ? '<div class="aw-you">Bạn!</div>' : ''}
    <div class="aw-h"><span class="aw-ic">${a.ic}</span><div><div class="aw-t">${a.t}</div><div class="aw-d">${a.d}</div></div></div>
    ${line(0)}${line(1)}</div>`;
}
function renderAwards() {
  const myCount = AWARDS.filter((a) => a.top.some(([n]) => n === S.viewer)).length;
  return `<div class="aw-bar"><span>Bạn lên bục <b>${myCount}</b>/${AWARDS.length} danh hiệu</span>
      <span class="aw-legend"><span><i class="sw glory"></i>Vinh danh</span><span><i class="sw tease"></i>Chọc ghẹo</span></span></div>
    <div class="aw-grid">${AWARDS.map(awardCard).join('')}</div>`;
}

// ---------- A ----------
function renderA() {
  const ps = players(), h = headline();
  const li = (p) => `<li class="${p.alive ? '' : 'dead'}"><span style="font-size:20px">${ROLE_ICON[p.role]}</span>
    <div><div class="nm">${p.name}${meTag(p)}</div><div class="ch">${p.char}</div></div>
    ${roleTag(p)}<div class="st">${fate(p)}</div></li>`;
  return `<div class="a-head"><div class="big">${h.ic}</div><h1>${FACTION[S.winner]} chiến thắng!</h1><p>${h.t} — ${h.s}</p></div>
  <div class="panel a-res">
    <div class="col win"><h3>🏆 Thắng</h3><ul>${ps.filter((p) => p.win).map(li).join('')}</ul></div>
    <div class="divider"></div>
    <div class="col lose"><h3>💀 Thua</h3><ul>${ps.filter((p) => !p.win).map(li).join('')}</ul></div>
  </div>
  <div class="panel a-stats"><h3>Thống kê <span class="ph">cột chỉ là ví dụ</span></h3>${statsTable(ps)}
    <div class="muted" style="margin-top:8px">Ô tô vàng = cao nhất ván. ${SCEN[S.winner].turns} lượt · ${SCEN[S.winner].mins} phút.</div></div>
  ${actions(true)}`;
}

// ---------- B ----------
// ===== Màn Kết quả — chuyển từ bang_wild_west_victory_defeat_screen.html sang CSS thuần (không Tailwind) =====
const FACTION_OF = { Sheriff: 'law', Deputy: 'law', Outlaw: 'outlaws', Renegade: 'renegade' };
const HAT = { Sheriff: '#d97706', Deputy: '#b45309', Outlaw: '#991b1b', Renegade: '#581c87' };

// Hai khẩu súng lục bắt chéo — giữ nguyên SVG từ file mẫu
const REVOLVER_PARTS = `

  <polygon points="110,46.5 112.1,51.2 117.2,51.7 113.3,55.1 114.5,60.1 110,57.4 105.5,60.1 106.7,55.1 102.8,51.7 107.9,51.2" fill="url(#brassGold)"/>
</svg>`;
const CYLINDER_ICON = `<svg class="r-cyl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/>
  <circle cx="12" cy="7" r="1.3" fill="currentColor"/><circle cx="16.3" cy="9.5" r="1.3" fill="currentColor"/><circle cx="16.3" cy="14.5" r="1.3" fill="currentColor"/>
  <circle cx="12" cy="17" r="1.3" fill="currentColor"/><circle cx="7.7" cy="14.5" r="1.3" fill="currentColor"/><circle cx="7.7" cy="9.5" r="1.3" fill="currentColor"/></svg>`;

// Chân dung cao bồi vẽ bằng SVG (từ file mẫu): mũ theo vai trò, khăn theo phe
function cowboySVG(p) {
  const hat = HAT[p.role];
  return `<svg viewBox="0 0 100 100" class="r-face" aria-hidden="true">
    <path d="M18 96 C22 72, 78 72, 82 96 Z" fill="#291709" stroke="#140a04" stroke-width="2"/>
    <polygon points="36,72 50,86 64,72 50,76" fill="${BANDANA[FACTION_OF[p.role]]}"/>
    <rect x="43" y="56" width="14" height="16" rx="4" fill="#d4a373"/>
    <path d="M33 34 C33 58, 41 64, 50 64 C59 64, 67 58, 67 34 Z" fill="#e6b88a" stroke="#5c3a21" stroke-width="1.5"/>
    <circle cx="43" cy="45" r="2.2" fill="#1c1917"/><circle cx="57" cy="45" r="2.2" fill="#1c1917"/>
    <path d="M39 42 L46 43.5 M61 42 L54 43.5" stroke="#3e230e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M41 56 Q50 52 59 56 Q55 60 50 57 Q45 60 41 56 Z" fill="#3e230e"/>
    <ellipse cx="50" cy="33" rx="34" ry="7" fill="${hat}" stroke="#271303" stroke-width="2"/>
    <path d="M31 33 C31 16, 42 15, 50 19 C58 15, 69 16, 69 33 Z" fill="${hat}" stroke="#271303" stroke-width="2"/>
    <path d="M31 30 Q50 34 69 30" fill="none" stroke="#fde047" stroke-width="2.5"/></svg>`;
}

function renderResult(ps) {
  const won = iWon();
  const me = ps.find((p) => p.name === S.viewer);
  // Như file mẫu: hiện đội của người xem, người xem đứng đầu
  const team = ps.filter((p) => FACTION_OF[p.role] === FACTION_OF[me.role]).sort((a, b) => (b.name === S.viewer) - (a.name === S.viewer));
  const card = (p) => {
    const isMe = p.name === S.viewer;
    return `<div class="r-card">
      <div class="r-medal-wrap">
        ${isMe ? '<div class="r-me-glow"></div>' : ''}
        <div class="r-medal"><div class="r-portrait ${p.role}">${cowboySVG(p)}
          ${p.alive ? '' : '<div class="r-down"><span>ĐÃ BỊ HẠ</span></div>'}</div></div>
        <div class="r-role ${p.role}">${p.role}</div>
      </div>
      <div class="r-name"><span class="nm">${p.name}</span>${isMe ? '<span class="r-you">Bạn</span>' : ''}</div>
      <div class="r-char">${p.char}</div>
    </div>`;
  };
  return `<div class="r-stage ${won ? 'win' : 'lose'}"><div class="r-board"></div>
    <div class="r-overlay">
      <span class="r-dust" style="top:25%;left:20%"></span><span class="r-dust b" style="top:66%;left:33%;animation-delay:1.4s"></span>
      <span class="r-dust" style="top:33%;right:25%;animation-delay:2.6s"></span><span class="r-dust b" style="bottom:25%;right:20%;animation-delay:3.5s"></span>
      <div class="r-frame">
        <h1 class="r-title">${won ? 'CHIẾN THẮNG' : 'THUA CUỘC'}</h1>
        <div class="r-emblem"><span class="ln"></span>${CROSSED_GUNS}<span class="ln r"></span></div>
        <div class="r-team">${team.map(card).join('')}</div>
        <button class="r-next" data-btab="awards">${CYLINDER_ICON}<span>Tiếp tục</span></button>
      </div>
    </div></div>`;
}

function renderB() {
  const ps = players(), won = iWon();
  const sc = SCEN[S.winner];
  const SCREENS = [['result', '🤠', 'Kết quả'], ['awards', '🏅', 'Danh hiệu'], ['table', '📊', 'Thống kê']];
  const nav = `<div class="b-nav">${SCREENS.map(([k, ic, l], i) => `<button data-btab="${k}" class="${S.bTab === k ? 'on' : ''}"><span class="n">${i + 1}</span>${ic} <span class="lb">${l}</span></button>`).join('')}</div>`;
  const WIN_TEXT = { Sheriff: 'Phe Sheriff & Deputy', Outlaw: 'Phe Outlaw', Renegade: 'Renegade' };
  const mini = `<div class="b-mini">${FACTION_ICON[S.winner]} <b>${WIN_TEXT[S.winner]} chiến thắng</b> · ${won ? 'Bạn đã thắng' : 'Bạn đã thua'}</div>`;

  if (S.bTab === 'awards') return mini + nav + renderAwards()
    + `<div class="b-foot"><button class="btn ghost" data-btab="result">← Kết quả</button><span class="sp"></span><button class="r-next small-next" data-btab="table">${CYLINDER_ICON}<span>Tiếp tục</span></button></div>`;
  if (S.bTab === 'table') {
    const sum = (k) => ps.reduce((n, p) => n + p[k], 0);
    return mini + nav + `<div class="kpis"><div class="kpi"><b>${sc.turns}</b>lượt chơi</div><div class="kpi"><b>${sc.mins}′</b>thời gian</div>
      <div class="kpi"><b>${sum('bang')}</b>phát Bang! cả bàn</div><div class="kpi"><b>${sum('taken')}</b>máu đã đổ</div></div>
      <div class="panel"><h3>Thống kê chi tiết <span class="ph">cột chỉ là ví dụ</span></h3>${statsTable(ps)}
      <div class="muted" style="margin-top:8px">Ô tô vàng = cao nhất ván. Viền xanh = phe thắng.</div></div>
      <div class="b-step"><button class="btn ghost" data-btab="awards">← Danh hiệu</button></div>` + actions(true);
  }
  return renderResult(ps);
}

// ---------- C ----------
function renderC() {
  const ps = players(), h = headline(), sc = SCEN[S.winner];
  const sorted = [...ps.filter((p) => p.win), ...ps.filter((p) => !p.win)];
  const firstLose = sorted.findIndex((p) => !p.win);
  const rows = sorted.map((p, i) => `${i === firstLose ? `<tr class="sep"><td colspan="${STAT_COLS.length + 3}"></td></tr>` : ''}
    <tr class="${p.win ? 'win' : 'lose'} ${p.alive ? '' : 'dead'}" style="${p.name === S.viewer ? 'background:rgba(47,93,138,.1)' : ''}">
      <td><div class="c-player"><span style="font-size:20px">${ROLE_ICON[p.role]}</span><div><b>${p.name}</b>${meTag(p)}<div class="ch">${p.char}</div></div></div></td>
      <td>${roleTag(p)}</td>
      <td><span class="res ${p.win ? 'w' : 'l'}">${p.win ? 'THẮNG' : 'THUA'}</span><div class="muted" style="font-size:11px;margin-top:2px">${p.alive ? 'sống' : `☠️ lượt ${p.diedTurn}`}</div></td>
      ${STAT_COLS.map(([k]) => `<td><span class="${p[k] === best(ps, k) && p[k] > 0 ? 'best' : ''}" style="padding:1px 6px">${p[k]}</span></td>`).join('')}
    </tr>`).join('');
  return `<div class="c-banner"><div class="ic">${h.ic}</div><div><h1>${FACTION[S.winner]} chiến thắng!</h1><p>${h.t} — ${h.s}</p></div>
    <div class="meta"><b>${sc.turns} lượt</b>${sc.mins} phút · ${ps.length} người</div></div>
  <div class="panel">
    <div class="chips">${awardsList(ps).slice(0, 4).map(([ic, t, p, v]) => `<span class="chip"><span>${ic}</span><b>${t}:</b> ${p.name} (${v(p)})</span>`).join('')}</div>
    <div class="tbl-wrap"><table class="stats"><thead><tr><th>Người chơi</th><th>Vai trò</th><th>Kết quả</th>${STAT_COLS.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin-top:8px">Một bảng duy nhất: người thắng ở trên, đường đứt ngăn cách người thua. Có thể bấm tiêu đề cột để sắp xếp.</div>
  </div>
  ${actions(true)}`;
}

// ---------- D ----------
function renderD() {
  const ps = players(), h = headline(), sc = SCEN[S.winner];
  const row = (p) => `<div class="r ${p.alive ? '' : 'dead'}"><span>${ROLE_ICON[p.role]}</span><span class="grow"><b>${p.name}</b>${meTag(p)} <span class="muted">· ${p.char}</span></span>${roleTag(p)}</div>`;
  const max = Math.max(1, best(ps, S.dStat));
  const color = { Sheriff: '#c48a12', Deputy: '#2f5d8a', Outlaw: '#6b2b1d', Renegade: '#5a4a7a' };
  const bars = [...ps].sort((a, b) => b[S.dStat] - a[S.dStat]).map((p) => `<div class="bar"><span>${p.name}${p.name === S.viewer ? ' (bạn)' : ''}</span>
    <div class="track"><div class="fill" style="width:${(p[S.dStat] / max) * 100}%;background:${color[p.role]}"></div></div><span class="num">${p[S.dStat]}</span></div>`).join('');
  return `<div class="d-stage"><div class="d-fakeboard"></div><div class="d-overlay"><div class="panel d-modal">
    <div class="d-top"><div class="ic">${h.ic}</div><h2 class="${iWon() ? 'win' : ''}">${h.t}</h2><div class="muted">${FACTION[S.winner]} chiến thắng sau ${sc.turns} lượt (${sc.mins} phút)</div></div>
    <div class="d-grid">
      <div class="d-box"><h4>Kết quả</h4><div class="d-team">
        <div class="hd w">🏆 Thắng</div>${ps.filter((p) => p.win).map(row).join('')}
        <div class="hd l">💀 Thua</div>${ps.filter((p) => !p.win).map(row).join('')}</div></div>
      <div class="d-box"><h4>Diễn biến</h4><ul class="timeline">
        ${sc.deaths.map(([v, k, t]) => `<li><span class="tn">Lượt ${t}</span><b>${v}</b> bị <b>${k}</b> hạ gục</li>`).join('')}
        <li class="end"><span class="tn">Lượt ${sc.turns}</span>🏁 ${FACTION[S.winner]} chiến thắng</li></ul></div>
    </div>
    <div class="d-box d-bars"><h4>Thống kê <span class="ph">chọn chỉ số</span></h4>
      <div class="sel">${STAT_COLS.map(([k, l]) => `<button data-dstat="${k}" class="${S.dStat === k ? 'on' : ''}">${l}</button>`).join('')}</div>${bars}</div>
    ${actions(false)}
  </div></div></div>`;
}

const DESIGNS = {
  A: ['A · Hai cột (theo phác thảo)', renderA, 'Đúng bố cục bạn vẽ: khung bo tròn chia đôi <b>Thắng | Thua</b>, bên dưới là <b>bảng thống kê</b>. Rõ ràng, dễ làm nhất.'],
  B: ['B · Màn ăn mừng + 3 màn', renderB, 'Chia <b>3 màn</b>: <b>① Kết quả</b> (theo file bang_wild_west_victory_defeat_screen.html: CHIẾN THẮNG / THUA CUỘC + đội của bạn) → bấm <b>TIẾP TỤC</b> → <b>② Danh hiệu</b> → <b>TIẾP TỤC</b> → <b>③ Thống kê</b>. Thanh 3 nút ở màn 2–3 để quay lại.'],
  C: ['C · Bảng tổng sắp', renderC, 'Gộp kết quả + thống kê vào <b>một bảng duy nhất</b> (kiểu bảng điểm cuối trận game bắn súng), có dòng danh hiệu nhanh ở trên. Gọn, hợp khi nhiều người chơi.'],
  D: ['D · Cửa sổ nổi + diễn biến', renderD, 'Hiện <b>cửa sổ nổi đè lên bàn chơi</b> (bàn mờ phía sau). Có thêm <b>dòng thời gian</b> ai hạ ai ở lượt nào, thống kê dạng <b>biểu đồ thanh</b> chọn từng chỉ số.'],
};

function render() {
  const btn = (key, val, label) => `<button data-${key}="${val}" class="${S[key] === val ? 'on' : ''}">${label}</button>`;
  $('#picker').innerHTML = `<span class="brand">Kết thúc ván</span>
    ${Object.entries(DESIGNS).map(([k, [l]]) => btn('design', k, l)).join('')}
    <span class="sep"></span><span class="lbl">Phe thắng:</span>${['Sheriff', 'Outlaw', 'Renegade'].map((w) => btn('winner', w, w)).join('')}
    <span class="sep"></span><span class="lbl">Xem như:</span>${BASE.map((p) => btn('viewer', p.name, `${p.name}${p.name === 'Toàn' ? ' (chủ phòng)' : ''}`)).join('')}`;
  $('#note').innerHTML = `<b>Phương án ${S.design}:</b> ${DESIGNS[S.design][2]} <span style="opacity:.7">— Số liệu là dữ liệu mẫu; các cột thống kê sẽ chốt sau.</span>`;
  $('#main').className = S.design === 'B' && S.bTab === 'awards' ? 'wide' : '';
  $('#main').innerHTML = DESIGNS[S.design][1]();
}
function $(s) { return document.querySelector(s); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  for (const k of ['design', 'winner', 'viewer', 'bTab', 'dStat']) {
    const attr = k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase()).replace('b-tab', 'btab').replace('d-stat', 'dstat');
    if (b.dataset[attr] !== undefined) { S[k] = b.dataset[attr]; render(); return; }
  }
});
render();
</script>
</body>
