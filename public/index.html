<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bang! Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;900&family=Lora:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/mobile.css" media="(max-width: 600px)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤠</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">BANG! <span>Online</span></div>
    <div class="topbar-actions">
      <div id="userbox"></div>
      <div class="sound-control" id="soundControl">
        <button class="btn ghost small" type="button" id="soundToggle" aria-label="Chỉnh âm lượng" aria-expanded="false" aria-controls="soundPanel">🔊</button>
        <div class="sound-panel" id="soundPanel" hidden>
          <label for="soundVolume">Âm lượng <output id="soundValue" for="soundVolume">65%</output></label>
          <input type="range" id="soundVolume" min="0" max="100" value="65">
        </div>
      </div>
    </div>
  </header>
  <main id="app"><div class="loading">Đang tải…</div></main>
  <div id="modal" class="modal hidden"></div>
  <div id="toasts"></div>
  <script src="/sounds.js"></script>
  <script src="/app.js"></script>
</body>
</html>
