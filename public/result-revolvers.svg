<svg viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <!-- Gunmetal Steel Gradient -->
            <linearGradient id="gunmetal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e2e8f0"/>
              <stop offset="35%" stop-color="#64748b"/>
              <stop offset="70%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#475569"/>
            </linearGradient>
            <!-- Brass & Gold Trim Gradient -->
            <linearGradient id="brassGold" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="45%" stop-color="#eab308"/>
              <stop offset="85%" stop-color="#a16207"/>
              <stop offset="100%" stop-color="#713f12"/>
            </linearGradient>
            <!-- Rosewood Grip Gradient -->
            <linearGradient id="woodGrip" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#9a3412"/>
              <stop offset="50%" stop-color="#5c210b"/>
              <stop offset="100%" stop-color="#2e0f04"/>
            </linearGradient>
          </defs>

          <!-- LEFT-TO-RIGHT REVOLVER (Pointing Up-Right) -->
          <g transform="translate(110, 62) rotate(-28) translate(-110, -62)">
            <!-- Barrel & Ejector Rod -->
            <rect x="108" y="38" width="84" height="9" rx="2" fill="url(#gunmetal)" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="110" y="47" width="66" height="4" rx="1.5" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
            <!-- Front Sight Blade -->
            <path d="M185 38 L190 32 L191 38 Z" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
            <!-- Frame & Top Strap -->
            <path d="M74 38 H110 V56 H76 Z" fill="url(#gunmetal)" stroke="#0f172a" stroke-width="1.5"/>
            <!-- Revolving Cylinder -->
            <rect x="82" y="40" width="22" height="15" rx="3" fill="url(#brassGold)" stroke="#451a03" stroke-width="1.5"/>
            <line x1="87" y1="41" x2="87" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <line x1="93" y1="41" x2="93" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <line x1="99" y1="41" x2="99" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <!-- Hammer Spur -->
            <path d="M74 40 L66 33 L71 31 L77 38 Z" fill="url(#brassGold)" stroke="#451a03" stroke-width="1.2"/>
            <!-- Trigger Guard & Trigger -->
            <path d="M84 56 C84 67, 102 67, 102 56" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
            <path d="M92 56 Q91 61 94 62" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
            <!-- Curved Western Rosewood Grip -->
            <path d="M75 44 C62 46, 51 64, 48 82 C47 86, 55 89, 63 87 C69 85, 74 68, 79 56 Z" fill="url(#woodGrip)" stroke="#271303" stroke-width="1.8"/>
            <!-- Brass Grip Medallion -->
            <circle cx="62" cy="70" r="3.2" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
          </g>

          <!-- RIGHT-TO-LEFT REVOLVER (Mirrored, Pointing Up-Left) -->
          <g transform="translate(220, 0) scale(-1, 1) translate(110, 62) rotate(-28) translate(-110, -62)">
            <!-- Barrel & Ejector Rod -->
            <rect x="108" y="38" width="84" height="9" rx="2" fill="url(#gunmetal)" stroke="#0f172a" stroke-width="1.5"/>
            <rect x="110" y="47" width="66" height="4" rx="1.5" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
            <!-- Front Sight Blade -->
            <path d="M185 38 L190 32 L191 38 Z" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
            <!-- Frame & Top Strap -->
            <path d="M74 38 H110 V56 H76 Z" fill="url(#gunmetal)" stroke="#0f172a" stroke-width="1.5"/>
            <!-- Revolving Cylinder -->
            <rect x="82" y="40" width="22" height="15" rx="3" fill="url(#brassGold)" stroke="#451a03" stroke-width="1.5"/>
            <line x1="87" y1="41" x2="87" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <line x1="93" y1="41" x2="93" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <line x1="99" y1="41" x2="99" y2="54" stroke="#713f12" stroke-width="1.3"/>
            <!-- Hammer Spur -->
            <path d="M74 40 L66 33 L71 31 L77 38 Z" fill="url(#brassGold)" stroke="#451a03" stroke-width="1.2"/>
            <!-- Trigger Guard & Trigger -->
            <path d="M84 56 C84 67, 102 67, 102 56" fill="none" stroke="url(#brassGold)" stroke-width="2.5"/>
            <path d="M92 56 Q91 61 94 62" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
            <!-- Curved Western Rosewood Grip -->
            <path d="M75 44 C62 46, 51 64, 48 82 C47 86, 55 89, 63 87 C69 85, 74 68, 79 56 Z" fill="url(#woodGrip)" stroke="#271303" stroke-width="1.8"/>
            <!-- Brass Grip Medallion -->
            <circle cx="62" cy="70" r="3.2" fill="url(#brassGold)" stroke="#451a03" stroke-width="1"/>
          </g>

          <!-- Center Brass Star Crest at Barrel Intersection -->
          <circle cx="110" cy="54" r="9" fill="#1c1008" stroke="url(#brassGold)" stroke-width="2"/>
          <polygon points="110,46.5 112.1,51.2 117.2,51.7 113.3,55.1 114.5,60.1 110,57.4 105.5,60.1 106.7,55.1 102.8,51.7 107.9,51.2" fill="url(#brassGold)"/>
        </svg>